[package]
name = "craftlions-factory"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-lite = "2.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
trillium = "1.4.0"
trillium-sse = "0.4.0"
trillium-static = { version = "0.6.1", features = ["tokio"] }
trillium-tokio = "0.6.4"

# macOS 26 dyld refuses debuginfo-stripped proc-macro dylibs ("mis-aligned
# LINKEDIT string pool"), so keep proc-macros and build scripts unstripped.
# This has no effect on the appliance binary itself.
[profile.release.build-override]
strip = "none"
