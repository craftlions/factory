[package]
name = "factory-guest"
version = "0.1.0"
edition = "2024"
publish = false
description = "Init process of a craftlions Factory session microvm"

# Kept apart from the server so the static binary that goes into every
# microvm's initramfs carries nothing but this.
[dependencies]
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
